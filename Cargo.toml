[package]
name = "handl-lib-type"
version = "0.1.0"
edition = "2024"
description = "type: runtime type-introspection interface — Handl stdlib port (ADR-0128 split)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/handl-lang/lib-type"

# `type`/`dependent` are pure handl; `typeof.*` ops are native
# `handl_ops::Op` impls.
[dependencies]
handl-lib-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"

[patch."https://github.com/handl-lang/kernel"]
handl-ops = { path = "../kernel/crates/handl-ops" }
handl-lib-ops = { path = "../kernel/crates/ops" }
